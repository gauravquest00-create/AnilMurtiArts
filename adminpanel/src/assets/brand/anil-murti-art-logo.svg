<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="100%" stop-color="#070708" />
    </radialGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFB770" />
      <stop offset="25%" stop-color="#C59A52" />
      <stop offset="50%" stop-color="#EED596" />
      <stop offset="75%" stop-color="#AC7F37" />
      <stop offset="100%" stop-color="#78531D" />
    </linearGradient>
    <linearGradient id="textGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DEC0" />
      <stop offset="40%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#8E6A2E" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="40" fill="url(#bgGlow)" />

  <!-- Artisan Brush Circle Arc -->
  <g transform="translate(250, 250) rotate(-15)">
    <!-- Outer textured arch -->
    <path d="M 0 -195 A 195 195 0 1 1 -180 65" 
          fill="none" 
          stroke="url(#goldRing)" 
          stroke-width="18" 
          stroke-linecap="round"
          stroke-dasharray="600 20"
          opacity="0.9" />
    
    <!-- Second overlapping dynamic layer for hand-painted stroke effect -->
    <path d="M 15 -190 A 185 185 0 1 1 -165 90" 
          fill="none" 
          stroke="#E8C988" 
          stroke-width="7" 
          stroke-linecap="round"
          opacity="0.75" />

    <path d="M -20 -198 A 200 200 0 1 1 -140 140" 
          fill="none" 
          stroke="#8A5E24" 
          stroke-width="4" 
          stroke-linecap="round"
          opacity="0.6" />

    <!-- Brushstroke tapering tail / tip at the bottom-right -->
    <path d="M 125 145 C 160 185, 175 200, 205 220 C 180 205, 160 175, 140 150 Z" 
          fill="url(#goldRing)" 
          opacity="0.95" />
  </g>

  <!-- Center Typography -->
  <!-- Serif luxury typography: ANIL MURTI ART -->
  <text x="250" y="195" 
        text-anchor="middle" 
        font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" 
        font-size="52" 
        font-weight="700" 
        letter-spacing="6" 
        fill="url(#textGold)" 
        filter="url(#subtleGlow)">ANIL</text>

  <text x="250" y="275" 
        text-anchor="middle" 
        font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" 
        font-size="62" 
        font-weight="700" 
        letter-spacing="5" 
        fill="url(#textGold)" 
        filter="url(#subtleGlow)">MURTI</text>

  <text x="250" y="348" 
        text-anchor="middle" 
        font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" 
        font-size="46" 
        font-weight="400" 
        letter-spacing="9" 
        fill="url(#textGold)">ART</text>
</svg>
